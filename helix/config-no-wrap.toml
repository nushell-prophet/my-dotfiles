# generated by `toolkit gen-no-wrap` (toolkit.nu) from config.toml; edit that file instead

theme = "ayu_evolve_cozy" # ayu_evolve plus a grey `↪`, see runtime/themes/ayu_evolve_cozy.toml

[editor]
auto-pairs = false
auto-save = false
bufferline = "multiple"
cursorcolumn = true
cursorline = true
insert-final-newline = true
line-number = "relative"
mouse = false
preview-completion-insert = true
shell = ["hx-nu", "--no-newline", "--stdin", "-c"]

[editor.whitespace.render]
nbsp = "all"
newline = "all"
nnbsp = "all"
space = "all"
tab = "all"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
character = "╎" # Some characters that work well: "▏", "┆", "┊", "⸽"
render = true
skip-levels = 1

# keep `enable` first in this section: `toolkit gen-no-wrap` (toolkit.nu) flips it to false for config-no-wrap.toml
[editor.soft-wrap]
enable = false
wrap-indicator = "↪ "
max-wrap = 25 # increase value to reduce forced mid-word wrapping

[editor.lsp]
auto-signature-help = false

[editor.statusline]
left = ["mode", "spinner", "file-name", "total-line-numbers", "file-encoding"]
center = []
right = ["selections", "primary-selection-length", "position", "position-percentage", "spacer", "diagnostics", "workspace-diagnostics", "version-control"]

[keys.normal]
# Use system clipboard
y = ["yank_main_selection_to_clipboard", "yank"]
p = "paste_clipboard_after"
P = "paste_clipboard_before"
d = ["yank_main_selection_to_clipboard", "delete_selection"]
X = ["extend_line_up", "extend_to_line_bounds"]
C-j = ["extend_to_line_bounds", "delete_selection", "paste_after"]
C-k = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]
C-right = "move_next_word_start"
C-left = "move_prev_word_end"
tab = "move_parent_node_end"
S-tab = "move_parent_node_start"

'C-r' = ":reload"

[keys.insert]
C-right = "move_next_word_start"
C-left = "move_prev_word_end"
S-tab = "move_parent_node_start"
up = "no_op"
down = "no_op"
left = "no_op"
right = "no_op"
pageup = "no_op"
pagedown = "no_op"
home = "no_op"
end = "no_op"

[keys.select]
y = ["yank_main_selection_to_clipboard", "yank"]
p = "paste_clipboard_after"
P = "paste_clipboard_before"
d = ["yank_main_selection_to_clipboard", "delete_selection"]
tab = "extend_parent_node_end"
S-tab = "extend_parent_node_start"

[keys.normal."+"]
# Helper bodies live in nu-hx.nu (hx-nu loads it for every shell call). Bindings use
# the :pipe family because only it sends the selection on stdin; a selection pasted
# into the command as %{selection} breaks on unlucky content (e.g. a stray '#).
a = ''':pipe #run selection, append output as # => comments→
nu-hx annotate
'''
A = ''':pipe #run selection, append output as # => comments, max 7 lines→
nu-hx annotate --abbreviate
'''

# Select a nu expression, press `+ b`: it evaluates the selection and grows the
# result as a RECTANGLE on the line(s) BELOW the command, aligned to the command's
# indent (the column-respect Helix's built-in `!` lacks). The command stays as a
# label. Seamless because it's a key sequence, not a prompt: nu-hx block-below edits
# the file on disk, so the buffer is saved first and re-read after.
b = [ # run selection, write its output as a block below it
  ":update",
  ":new",
  ":buffer-close!",
  ":pipe-to nu-hx block-below r#'%{buffer_name}'# %{selection_line_end}",
  ":reload",
]

# the selection comes from stdin ($in), so prose with `'#` (markdown headers etc.)
# can't terminate the prompt string
# Why: the flags skip settings, CLAUDE.md, MCP servers, tools and skills — about 2x faster,
# and the reply holds only the corrected text, with no rules from CLAUDE.md
c = '''
:pipe #correct english→
^claude -p --model haiku --setting-sources '' --strict-mcp-config --tools '' --disable-slash-commands --no-session-persistence $"Correct grammar in the text. Respond only with corrected text.\n<text>($in)</text>"
'''

C = ":pipe nu-hx clear-annotations" # remove `# =>` result comments

e = ":pipe dotnu embeds-update" # rerun `| print $in` capture points, refresh `# =>` embeds

f = ":pipe nu-hx flatten" # flatten-to-nuon

# commit the whole file: save, wait for it as `+ h` does, stage the file, then write the
# message as in `+ G`. Helix cannot prompt for text inside a command list, so git asks.
# Why :pipe-to and --block-until-exit: :reload re-reads the gutter's base (HEAD), so it must
# run after the commit; :sh is async in Helix and `zellij run` returns at once by default.
# keep_primary_selection: :pipe-to runs once per selection, which would commit twice.
g = [
  ":update",
  ":new",
  ":buffer-close!",
  "keep_primary_selection",
  ''':pipe-to #commit the file→
nu-hx commit --add r#'%{buffer_name}'#
''',
  ":reload",
]

# commit in a Zellij pane that takes this pane's place until git exits: git opens its own
# hx on COMMIT_EDITMSG with the staged diff below the scissors line.
# Why the pause on failure: --close-on-exit would hide "nothing to commit" or a hook error
# before it could be read.
# Waits and reloads for the same reason as `+ g`: the gutter.
# Saves first so the final :reload cannot drop unsaved edits.
G = [
  ":update",
  ":new",
  ":buffer-close!",
  "keep_primary_selection",
  ''':pipe-to #commit with diff→
nu-hx commit r#'%{buffer_name}'#
''',
  ":reload",
]

# stage the selected lines (h for hunk). The gutter compares with HEAD, not the index, so
# it does not change after staging.
# Why :new + :buffer-close! after :update: Helix saves in the background, so a plain
# :update then %sh{} stages the old disk content. Closing a buffer waits for pending
# writes and format-on-save; if the write fails, the close fails and the script refuses
# the [scratch] buffer, so nothing wrong is staged. `+ b` and `+ t` wait the same way.
h = [":update", ":new", ":buffer-close!", ":echo %sh{git-stage-lines r#'%{buffer_name}'# %{selection_line_start} %{selection_line_end}}"] # stage the selected lines

n = ":append-output date now | format date %%J-%%Q" # timestamp

# run the whole file in the nu pane of this Zellij tab: paste it there and press Enter.
# Saves first and waits for the save, as `+ b` does, because the text comes from the file on disk.
# Why: a long pipeline is tweaked run after run, and in the nu prompt the cursor goes back to
# the edit point each time; in Helix it stays where it was.
r = [":update", ":new", ":buffer-close!", ":sh nu-hx send-to-nu r#'%{buffer_name}'#"] # run the file in the nu pane of this tab

# re-align the columns of a selected markdown table
p = ":pipe nu-hx align-table"

# `s` copies the selection as an <selected-text> tag with a REPO-RELATIVE path,
# `S` with the ABSOLUTE path. Path is computed in nushell (inside nu-hx copy-tag)
# because `%sh{}` runs through hx-nu (nushell), where POSIX `$(...)` does not work.
s = [ ":pipe-to nu-hx copy-tag r#'%{buffer_name}'# %{selection_line_start} %{selection_line_end}" ] # copy selection as a tag with the repo-relative path

S = [ ":pipe-to nu-hx copy-tag --absolute r#'%{buffer_name}'# %{selection_line_start} %{selection_line_end}" ] # same, with the absolute path

# `t` copies the selection as the same tag addressed by a change-id link instead of a path,
# so it survives a history rewrite. :update comes FIRST: `cozy git link` refuses a file with
# uncommitted changes, and an unsaved buffer would pass that check while differing from the
# commit. On the refusal, `+ g` commits the buffer.
t = [ ":update", ":new", ":buffer-close!", ":pipe-to nu-hx copy-link-tag (cozy git link r#'%{buffer_name}'#) %{selection_line_start} %{selection_line_end}" ] # copy selection as a tag with a change-id link

w = ":set soft-wrap.enable false" # soft-wrap off
W = ":set soft-wrap.enable true" # soft-wrap on

'?' = ":sh nu-hx keys '+' | format pattern '{key}  {does}' | str join (char newline)" # this list

[keys.normal."\\"]
# the gi canvas keys: commit a canvas, hand it to Claude, find the agent's markers,
# comment a span.
# Not a submenu of `+` because: a submenu costs one more key on every canvas action.

# quick commit for a gi canvas: commit this file alone with a message that counts the markers
# and comments it adds (`gi: !! 2, {>> 1`), no editor. Waits for the save and reloads as
# `+ g` does, for the same reason: the gutter. `+ g` stays for commits with a written message.
# Why no message to write: in a canvas the instructions live in the text; `\ l` then hands
# the batch to Claude.
k = [
  ":update",
  ":new",
  ":buffer-close!",
  "keep_primary_selection",
  ''':pipe-to #quick commit→
nu-hx quick-commit r#'%{buffer_name}'#
''',
  ":reload",
]

# let Claude know: type `!git log -p` of this file's commits that Claude was not sent yet
# into the Claude pane of this Zellij tab, with Enter. Unsaved or uncommitted edits are
# committed first, as `\ k` does, so one key delivers an edit; `\ k` stays for batches.
# Waits for the save and reloads as `+ g` does, for the same reason: the gutter.
# Why a key and not a hook on `+ g`: the user commits several times and tells Claude when done.
l = [
  ":update",
  ":new",
  ":buffer-close!",
  "keep_primary_selection",
  ''':pipe-to #let Claude know→
nu-hx tell-claude r#'%{buffer_name}'#
''',
  ":reload",
]

# search for the agent's canvas markers (!!! ??? %%%) and CriticMarkup comments (`{>>`, as
# `\ i` writes them), and the agent's entries from its latest turn (`AA*:`, by the Canvas
# style); n and N jump to the next and previous.
# Why only 3-char: those are the agent's, the ones the user has to act on.
# Why `{>>` and not `{==`: `\ i` writes both, and one comment should be one stop.
# Why a search, not a selection of all: the user only needs the first hit, n does the rest.
# Why no line anchor: agents also put markers after a list bullet, in headings, mid-line.
# Mentions in backticks match too: Helix regex has no lookaround to skip them.
m = '@/!!!|\?\?\?|%%%|\{<gt><gt>|AA\*:<ret>' # search for the agent's canvas markers, newest AA*: entries and CriticMarkup comments

# comment on the selection in CriticMarkup: `{==selection==}{>><<}`, cursor inside the comment.
# The one CriticMarkup key: a plain edit already shows in git word by word, so only a remark
# tied to a span inside a line needs a tag (a marker line cannot point there).
# A macro, because a :pipe command cannot leave Helix in insert mode at the right place.
# Why 3h after <esc>: `c … <esc>` leaves the cursor on the char after the typed text,
# and 3h walks back over the closing `<<}`.
# Why <gt> and <lt>: a bare > or < starts Helix key notation and fails to parse.
# Why no spaces inside the tags: in CriticMarkup they become part of the text on accept.
# With no selection it wraps the one char under the cursor: select the span first.
i = '@c{==<C-r>"==}{<gt><gt><lt><lt>}<esc>3hi' # comment on the selection (CriticMarkup)

'?' = ":sh nu-hx keys '\\' | format pattern '{key}  {does}' | str join (char newline)" # this list
