# Lazygit sets TERM=dumb in its pager PTY, so delta can't auto-detect truecolor.
# --true-color=always: forces delta to emit 24-bit color for syntax highlighting.
# --minus/plus-style 256-color: lazygit's ANSI parser drops truecolor backgrounds
#   (48;2;R;G;B) but handles 256-palette backgrounds (48;5;N) correctly.
#   Without these, hunk backgrounds disappear inside lazygit.
# Docker sandbox has no system clipboard. We use the pbcopy OSC 52 shim
# installed in the Dockerfile (see cozy/Dockerfile, cozy/pbcopy).
os:
  copyToClipboardCmd: printf {{text}} | pbcopy
git:
  autoFetch: false
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never --true-color=always --minus-style='syntax 52' --plus-style='syntax 22' --line-numbers --side-by-side --wrap-max-lines 20
customCommands:
  - key: 'E'
    context: 'files'
    command: 'zellij edit {{.SelectedFile.Name}}'
    description: 'Edit file in Zellij'
  - key: 'E'
    context: 'commitFiles'
    command: 'zellij edit {{.SelectedFile.Name}}'
    description: 'Edit file in Zellij'
  # Copy an agent-ready pointer to the clipboard (pbcopy = OSC 52 -> host).
  # Why: hand an agent a precise file reference, like the helix selected-text command.
  # Working-tree file -> absolute path. The agent opens it directly, no git needed.
  # Not <branch>:<path> because: a branch tip moves (unstable link), and git already
  #   reads <branch>:<path> as the *committed* blob, not the file on disk you're pointing at.
  - key: '<c-y>'
    context: 'files'
    command: 'p=$(realpath -- {{.SelectedFile.Name | quote}}); printf %s "$p" | pbcopy; echo "copied: $p"'
    description: 'Copy absolute path to clipboard'
    output: log
  # Selected file (working tree or a commit's file list) -> path relative to the dir lazygit was launched from.
  # Why ctrl+o: it is lazygit's built-in copy (repo-root path), so muscle memory lands here.
  # SelectedPath is the commit file's path when commitFiles is focused, the working-tree path otherwise.
  # LG_START_DIR is set by the zellij Super Alt l launcher (sh -c):
  #   lazygit chdirs to the repo root and the shell resets $PWD, so the launch dir is gone here.
  # Why nushell: it is on every machine this config reaches; macOS realpath has no --relative-to.
  # Not `path relative-to` because: it fails unless the file is inside the base dir, so it never yields ../
  #   The shared leading segments are counted instead; each leftover base segment becomes a ..
  # Unset LG_START_DIR fails loudly on its own (Cannot find column 'LG_START_DIR').
  - key: '<c-o>'
    context: 'files, commitFiles'
    command: 'P={{.SelectedPath | quote}} nu --no-config-file --commands ''let f = $env.P | path expand | path split; let b = $env.LG_START_DIR | path expand | path split; let n = $f | zip $b | take while { $in.0 == $in.1 } | length; let r = [...($b | skip $n | each { ".." }) ...($f | skip $n)] | path join; $r | ^pbcopy; print $"copied: ($r)"'''
    description: 'Copy cwd-relative path to clipboard'
    output: log
  # File at a specific commit -> <full-hash>:<repo-relative-path>. This is literal git
  #   syntax (git show <hash>:<path>); the hash is immutable, so the link is stable.
  - key: '<c-y>'
    context: 'commitFiles'
    command: 'ref=$(printf "%s:%s" {{.SelectedCommit.Hash | quote}} {{.SelectedCommitFilePath | quote}}); printf %s "$ref" | pbcopy; echo "copied: $ref"'
    description: 'Copy <hash>:<path> to clipboard'
    output: log
